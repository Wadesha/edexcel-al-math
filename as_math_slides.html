b)=F(b)-F(a-1)$。</p>"}, {"k": "note", "t": "常见失分点", "h": "<h2>常见失分点</h2><ul><li>没检查独立性就套二项分布（无放回抽样要用超几何思路，不是二项）。</li><li>\"至少\"与\"超过\"混淆：$\\mathrm{P}(X&gt;3)=\\mathrm{P}(X\\ge4)$。</li><li>忘记 $p$ 是\"成功\"的概率，把题目给的失败率直接代入。</li></ul>"}, {"k": "ex", "t": "例 1", "h": "<h2>例 1</h2><div class=\"stem\"><p>某射手每次命中概率 $0.4$，独立射击 $6$ 次。求恰好命中 $3$ 次的概率。</p></div>"}, {"k": "sol", "t": "例 1 解答", "h": "<h2 class=\"sol\">例 1 · 解答</h2><p>$X\\sim\\mathrm{B}(6,0.4)$。</p>\n<p>$$\\mathrm{P}(X=3)=\\binom63(0.4)^3(0.6)^3=20\\times0.064\\times0.216=0.2765$$</p>"}, {"k": "ex", "t": "例 2", "h": "<h2>例 2</h2><div class=\"stem\"><p>同上，求至少命中 $4$ 次的概率。</p></div>"}, {"k": "sol", "t": "例 2 解答", "h": "<h2 class=\"sol\">例 2 · 解答</h2><p>$$\\mathrm{P}(X\\ge4)=\\mathrm{P}(X=4)+\\mathrm{P}(X=5)+\\mathrm{P}(X=6)$$</p>\n<p>$$=\\binom64(0.4)^4(0.6)^2+\\binom65(0.4)^5(0.6)+(0.4)^6$$</p>\n<p>$$=15(0.0256)(0.36)+6(0.01024)(0.6)+0.004096$$</p>\n<p>$$=0.1382+0.0369+0.0041=0.1792$$</p>"}, {"k": "ex", "t": "例 3", "h": "<h2>例 3</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(12,0.35)$，查表得 $F(4)=0.5833$，$F(7)=0.9745$。求 $\\mathrm{P}(5\\le X\\le7)$ 与 $\\mathrm{P}(X\\ge8)$。</p></div>"}, {"k": "sol", "t": "例 3 解答", "h": "<h2 class=\"sol\">例 3 · 解答</h2><p>$$\\mathrm{P}(5\\le X\\le7)=F(7)-F(4)=0.9745-0.5833=0.3912$$</p>\n<p>$$\\mathrm{P}(X\\ge8)=1-F(7)=1-0.9745=0.0255$$</p>"}, {"k": "q", "t": "练习 1", "h": "<h2>练习 1</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(5,0.3)$，求 $\\mathrm{P}(X=2)$。</p></div>"}, {"k": "a", "t": "练习 1 答案", "h": "<h2 class=\"sol\">练习 1 · 答案</h2><div class=\"ans\"><p>$\\binom52(0.3)^2(0.7)^3=10\\times0.09\\times0.343=0.3087$。</p></div>"}, {"k": "q", "t": "练习 2", "h": "<h2>练习 2</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(8,0.5)$，求 $\\mathrm{P}(X=0)$ 与 $\\mathrm{P}(X=8)$。</p></div>"}, {"k": "a", "t": "练习 2 答案", "h": "<h2 class=\"sol\">练习 2 · 答案</h2><div class=\"ans\"><p>$\\mathrm{P}(X=0)=0.5^8=\\dfrac{1}{256}=0.00391$；$\\mathrm{P}(X=8)=0.5^8=\\dfrac{1}{256}$（对称）。</p></div>"}, {"k": "q", "t": "练习 3", "h": "<h2>练习 3</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(10,0.25)$，求 $\\mathrm{P}(X\\le1)$。</p></div>"}, {"k": "a", "t": "练习 3 答案", "h": "<h2 class=\"sol\">练习 3 · 答案</h2><div class=\"ans\"><p>$\\mathrm{P}(X=0)=0.75^{10}=0.0563$；$\\mathrm{P}(X=1)=\\binom{10}{1}(0.25)(0.75)^9=10\\times0.25\\times0.0751=0.1877$。合计 $=0.2440$。</p></div>"}, {"k": "q", "t": "练习 4", "h": "<h2>练习 4</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(9,0.6)$，用 $\\mathrm{P}(X\\ge7)$ 的补事件形式写出计算式并求到 $3$ 位有效数字。</p></div>"}, {"k": "a", "t": "练习 4 答案", "h": "<h2 class=\"sol\">练习 4 · 答案</h2><div class=\"ans\"><p>$\\mathrm{P}(X\\ge7)=\\mathrm{P}(X=7)+\\mathrm{P}(X=8)+\\mathrm{P}(X=9)=\\binom97(0.6)^7(0.4)^2+\\binom98(0.6)^8(0.4)+(0.6)^9=36(0.0280)(0.16)+9(0.0168)(0.4)+0.0101=0.1612+0.0605+0.0101=0.232$。</p></div>"}, {"k": "q", "t": "练习 5", "h": "<h2>练习 5</h2><div class=\"stem\"><p>袋中有放回地抽 $15$ 次，每次抽到红球概率 $0.2$。写出红球数的分布，并求恰有 $3$ 个红球的概率。</p></div>"}, {"k": "a", "t": "练习 5 答案", "h": "<h2 class=\"sol\">练习 5 · 答案</h2><div class=\"ans\"><p>有放回保证独立与概率不变，故 $X\\sim\\mathrm{B}(15,0.2)$。$\\mathrm{P}(X=3)=\\binom{15}{3}(0.2)^3(0.8)^{12}=455\\times0.008\\times0.0687=0.250$。</p></div>"}, {"k": "q", "t": "练习 6", "h": "<h2>练习 6</h2><div class=\"stem\"><p>说明在什么情况下不能用二项分布为\"从 $20$ 件产品中不放回抽取 $5$ 件中的次品数\"建模，并说明原因。</p></div>"}, {"k": "a", "t": "练习 6 答案", "h": "<h2 class=\"sol\">练习 6 · 答案</h2><div class=\"ans\"><p>不放回抽取时各次试验<strong>不独立</strong>（第一次的结果改变了剩余次品比例），且每次抽到次品的概率不再相同，不满足二项分布的条件，因此不能直接建模为二项分布。</p></div>"}]}, {"key": "S5_假设检验", "title": "S5 · 统计假设检验 Statistical hypothesis testing", "short": "统计假设检验 Statistical hypothesis testing", "group": "S", "slides": [{"k": "cover", "t": "S5 · 统计假设检验 Statistical hypothesis testing", "h": "<div class=\"cover\"><h1>S5 · 统计假设检验 Statistical hypothesis testing</h1><p class=\"sub\">考纲编号 Topic 5（Paper 2 统计）｜ AS 的检验只针对<strong>二项分布的比例 $p$</strong>，套路固定，是 Paper 2 的必拿分题。</p></div>"}, {"k": "spec", "t": "考纲要求", "h": "<h2>考纲要求</h2><ul class=\"big\"><li><p>5.1 理解并应用统计假设检验的<strong>语言</strong>：原假设、备择假设、显著性水平、检验统计量、单尾检验、双尾检验、临界值、临界域、接受域、$p$ 值。</p></li><li><p>5.2 对<strong>二项分布中的比例</strong>进行假设检验，并在<strong>情境中解释结果</strong>；理解用样本对总体作推断、显著性水平就是<strong>错误拒绝原假设的概率</strong>。</p></li></ul>"}, {"k": "note", "t": "五个术语必须写准", "h": "<h2>五个术语必须写准</h2><ul><li><strong>原假设 $H_0$</strong>：默认成立的假设，写为 $H_0:p=0.4$（含等号）。</li><li><strong>备择假设 $H_1$</strong>：想要找证据支持的假设，$H_1:p&gt;0.4$、$p&lt;0.4$ 或 $p\\neq0.4$。</li><li><strong>显著性水平</strong>（significance level）：通常 $5\\%$ 或 $10\\%$，是\"当 $H_0$ 为真时仍错误拒绝它\"的概率上限。</li><li><strong>检验统计量</strong>：这里就是观测到的成功次数 $X$。</li><li><strong>临界域</strong>（critical region）与<strong>接受域</strong>：使拒绝 $H_0$ 的取值集合 / 其余取值集合；边界值称<strong>临界值</strong>。</li><li><strong>$p$ 值</strong>：在 $H_0$ 成立时，观测到<strong>至少同样极端</strong>结果的概率。$p$ 值 $&lt;$ 显著性水平则拒绝 $H_0$。</li></ul>"}, {"k": "note", "t": "单尾与双尾", "h": "<h2>单尾与双尾</h2><ul><li>$H_1:p&gt;p_0$ → 单尾（右尾），$H_1:p&lt;p_0$ → 单尾（左尾）；</li><li>$H_1:p\\neq p_0$ → <strong>双尾</strong>，显著性水平要<strong>分到两端</strong>（$5\\%$ 的检验每端 $2.5\\%$）。</li></ul>"}, {"k": "note", "t": "二项检验的固定流程（关键：看哪一端\"更极端\"）", "h": "<h2>二项检验的固定流程（关键：看哪一端\"更极端\"）</h2><p>设 $X\\sim\\mathrm{B}(n,p_0)$（$p_0$ 是 $H_0$ 中的值）。</p>\n<ol><li>写出 $H_0$ 与 $H_1$（<strong>必须含符号且说明 $p$ 的含义</strong>）。</li><li>确定方向：若 $H_1:p&gt;p_0$，极端方向在<strong>右侧</strong>，计算 $\\mathrm{P}(X\\ge x_{\\text{obs}})$；若 $H_1:p&lt;p_0$，计算 $\\mathrm{P}(X\\le x_{\\text{obs}})$（$x_{\\text{obs}}$ 是实际观测值）。</li><li>与显著性水平比较：概率 $\\le\\alpha$ 则<strong>拒绝 $H_0$</strong>；否则<strong>不拒绝 $H_0$</strong>。</li><li>用<strong>题目情境</strong>写出结论（\"有证据表明……\" / \"没有足够证据表明……\"）。</li></ol>\n<p>也可以反过来先求临界域：找出使 $\\mathrm{P}(X\\ge c)\\le\\alpha$ 的最小 $c$，临界域为 $X\\ge c$；再看观测值是否落入。</p>"}, {"k": "note", "t": "结论的写法（最容易丢分）", "h": "<h2>结论的写法（最容易丢分）</h2><ul><li>拒绝 $H_0$ 时：<strong>\"有足够证据（在 $5\\%$ 水平）表明 ……\"</strong>，不能说\"证明了……\"。</li><li>不拒绝 $H_0$ 时：<strong>\"没有足够证据表明 ……\"</strong>，<strong>不能</strong>说\"$H_0$ 为真\"或\"接受 $H_0$\"（严格讲只是证据不足）。</li><li>必须回到情境：说明这个结论对实际问题意味着什么。</li></ul>"}, {"k": "note", "t": "两类错误（理解层面）", "h": "<h2>两类错误（理解层面）</h2><ul><li>第 I 类错误：$H_0$ 为真却拒绝它，概率就是显著性水平 $\\alpha$。</li><li>第 II 类错误：$H_0$ 为假却没有拒绝它。</li></ul>"}, {"k": "note", "t": "常见失分点", "h": "<h2>常见失分点</h2><ul><li>忘记说明 $p$ 代表什么（\"设 $p$ 为……的比例\"）。</li><li>方向搞反：观测值大于期望却算左尾概率。</li><li>结论写成\"接受 $H_0$\"或\"证明了\"。</li></ul>"}, {"k": "ex", "t": "例 1", "h": "<h2>例 1</h2><div class=\"stem\"><p>厂家声称其生产的芯片有 $40\\%$ 为 A 级。检验员随机抽取 $20$ 片，发现 $12$ 片为 A 级。在 $5\\%$ 水平检验\"实际比例高于 $40\\%$\"。</p></div>"}, {"k": "sol", "t": "例 1 解答", "h": "<h2 class=\"sol\">例 1 · 解答</h2><p>设 $p$ 为 A 级芯片的真实比例。</p>\n<p>$$H_0:p=0.4,\\qquad H_1:p&gt;0.4$$</p>\n<p>在 $H_0$ 下 $X\\sim\\mathrm{B}(20,0.4)$，观测值 $x=12$。</p>\n<p>$$\\mathrm{P}(X\\ge12)=1-\\mathrm{P}(X\\le11)$$</p>\n<p>用累积表：$\\mathrm{P}(X\\le11)=0.9435$，故 $\\mathrm{P}(X\\ge12)=0.0565$。</p>\n<p>$0.0565&gt;0.05$，<strong>不拒绝 $H_0$</strong>。</p>\n<p>结论：在 $5\\%$ 显著性水平下，没有足够证据表明 A 级芯片比例高于 $40\\%$。（注意：这不等于证明了比例就是 $40\\%$。）</p>"}, {"k": "ex", "t": "例 2", "h": "<h2>例 2</h2><div class=\"stem\"><p>某硬币被怀疑偏向反面。掷 $30$ 次得正面 $9$ 次。在 $5\\%$ 水平检验硬币是否偏向反面，并给出临界域。</p></div>"}, {"k": "sol", "t": "例 2 解答", "h": "<h2 class=\"sol\">例 2 · 解答</h2><p>设 $p$ 为掷出正面的概率。</p>\n<p>$$H_0:p=0.5,\\qquad H_1:p&lt;0.5$$</p>\n<p>在 $H_0$ 下 $X\\sim\\mathrm{B}(30,0.5)$，观测值 $x=9$。</p>\n<p>$$\\mathrm{P}(X\\le9)=0.0214\\quad(\\text{查累积表})$$</p>\n<p>$0.0214&lt;0.05$，<strong>拒绝 $H_0$</strong>。</p>\n<p>结论：有足够证据表明该硬币偏向反面（正面概率小于 $0.5$）。</p>\n<p>临界域：找出使 $\\mathrm{P}(X\\le c)\\le0.05$ 的最大 $c$。查表 $\\mathrm{P}(X\\le10)=0.0494\\le0.05$，$\\mathrm{P}(X\\le11)=0.1002&gt;0.05$，故临界域为 $X\\le10$。</p>"}, {"k": "ex", "t": "例 3", "h": "<h2>例 3</h2><div class=\"stem\"><p>在 $10\\%$ 水平检验 $H_0:p=0.5$ 对 $H_1:p\\neq0.5$，$n=12$，观测 $x=2$。说明如何分配显著性水平。</p></div>"}, {"k": "sol", "t": "例 3 解答", "h": "<h2 class=\"sol\">例 3 · 解答</h2><p>双尾检验把 $10\\%$ 分到两端，每端 $5\\%$。</p>\n<p>左尾：$\\mathrm{P}(X\\le2)$（查 $\\mathrm{B}(12,0.5)$ 表）$=0.0193&lt;0.05$。</p>\n<p>已落入临界域，<strong>拒绝 $H_0$</strong>。结论：有足够证据表明 $p\\neq0.5$（且观测偏低，说明 $p&lt;0.5$）。</p>"}, {"k": "q", "t": "练习 1", "h": "<h2>练习 1</h2><div class=\"stem\"><p>写出假设检验中下列术语的含义：原假设、备择假设、显著性水平。</p></div>"}, {"k": "a", "t": "练习 1 答案", "h": "<h2 class=\"sol\">练习 1 · 答案</h2><div class=\"ans\"><p>原假设 $H_0$ 是默认成立、含等号的假设（如 $p=0.4$）；备择假设 $H_1$ 是我们希望找到证据支持的假设（如 $p&gt;0.4$）；显著性水平 $\\alpha$ 是当 $H_0$ 为真时错误拒绝 $H_0$ 的概率上限（常用 $5\\%$）。</p></div>"}, {"k": "q", "t": "练习 2", "h": "<h2>练习 2</h2><div class=\"stem\"><p>说明单尾检验与双尾检验在显著性水平分配上的区别。</p></div>"}, {"k": "a", "t": "练习 2 答案", "h": "<h2 class=\"sol\">练习 2 · 答案</h2><div class=\"ans\"><p>单尾检验把全部显著性水平放在一端（如 $5\\%$ 全在右尾）；双尾检验分到两端（$5\\%$ 的检验每端 $2.5\\%$，$10\\%$ 的检验每端 $5\\%$）。</p></div>"}, {"k": "q", "t": "练习 3", "h": "<h2>练习 3</h2><div class=\"stem\"><p>$X\\sim\\mathrm{B}(15,0.3)$，在 $H_1:p&gt;0.3$ 下观测 $x=8$，求检验用的概率。</p></div>"}, {"k": "a", "t": "练习 3 答案", "h": "<h2 class=\"sol\">练习 3 · 答案</h2><div class=\"ans\"><p>右尾：$\\mathrm{P}(X\\ge8)=1-\\mathrm{P}(X\\le7)$。查累积表 $\\mathrm{P}(X\\le7)=0.9500$，故 $\\mathrm{P}(X\\ge8)=0.0500$。</p></div>"}, {"k": "q", "t": "练习 4", "h": "<h2>练习 4</h2><div class=\"stem\"><p>承上题，若在 $5\\%$ 水平检验，结论是什么？</p></div>"}, {"k": "a", "t": "练习 4 答案", "h": "<h2 class=\"sol\">练习 4 · 答案</h2><div class=\"ans\"><p>$p$ 值 $=0.0500\\le0.05$，落在临界域内，<strong>拒绝 $H_0$</strong>。有足够证据表明真实比例高于 $0.3$。（注意：恰好等于临界值时按\"$\\le\\alpha$ 即拒绝\"处理，属于边界情形。）</p></div>"}, {"k": "q", "t": "练习 5", "h": "<h2>练习 5</h2><div class=\"stem\"><p>为什么说\"没有拒绝 $H_0$\"不等于\"$H_0$ 为真\"？</p></div>"}, {"k": "a", "t": "练习 5 答案", "h": "<h2 class=\"sol\">练习 5 · 答案</h2><div class=\"ans\"><p>检验的结论只有两种：证据足以拒绝 $H_0$，或证据不足以拒绝 $H_0$。后者只是说明样本没有提供足够的反例，并不意味着已经证明 $H_0$ 成立——样本量小、效应弱时都可能得出\"不拒绝\"，但真实情况可能不同。</p></div>"}, {"k": "q", "t": "练习 6", "h": "<h2>练习 6</h2><div class=\"stem\"><p>解释显著性水平 $5\\%$ 的含义。</p></div>"}, {"k": "a", "t": "练习 6 答案", "h": "<h2 class=\"sol\">练习 6 · 答案</h2><div class=\"ans\"><p>若 $H_0$ 实际为真，那么我们用这个检验仍有 $5\\%$ 的概率（由于抽样的偶然性）错误地拒绝它，这称为第 I 类错误。显著性水平就是这个错误概率的上限。</p></div>"}]}, {"key": "M6_量与单位", "title": "M6 · 力学中的量与单位 Quantities and units in mechanics", "short": "力学中的量与单位 Quantities and units in mechanics", "group": "M", "slides": [{"k": "cover", "t": "M6 · 力学中的量与单位 Quantities and units in mechanics", "h": "<div class=\"cover\"><h1>M6 · 力学中的量与单位 Quantities and units in mechanics</h1><p class=\"sub\">考纲编号 Topic 6（Paper 2 力学）｜ 短小但贯穿所有力学题：单位写错会连带丢分。</p></div>"}, {"k": "spec", "t": "考纲要求", "h": "<h2>考纲要求</h2><ul class=\"big\"><li><p>6.1 理解并使用国际单位制（S.I.）中的<strong>基本量</strong>：<strong>长度、时间、质量</strong>；理解并使用<strong>导出量</strong>与单位：<strong>速度、加速度、力、重量</strong>。</p></li></ul>"}, {"k": "note", "t": "基本量与单位", "h": "<h2>基本量与单位</h2><table><thead><tr><th>基本量</th><th>S.I. 基本单位</th><th>符号</th></tr></thead><tbody><tr><td>长度 length</td><td>米 metre</td><td>m</td></tr><tr><td>时间 time</td><td>秒 second</td><td>s</td></tr><tr><td>质量 mass</td><td>千克 kilogram</td><td>kg</td></tr></tbody></table>\n<p>注意：质量的单位是 <strong>kg</strong>，不是克；长度用 <strong>m</strong>，不是 cm——力学计算中若题目给的是 cm、分钟、克，<strong>先换算</strong>再代入公式。</p>"}, {"k": "note", "t": "导出量与单位", "h": "<h2>导出量与单位</h2><table><thead><tr><th>导出量</th><th>定义</th><th>单位</th></tr></thead><tbody><tr><td>速度 velocity</td><td>位移变化率</td><td>m s$^{-1}$</td></tr><tr><td>加速度 acceleration</td><td>速度变化率</td><td>m s$^{-2}$</td></tr><tr><td>力 force</td><td>由 $F=ma$ 定义</td><td>牛顿 N，$1\\ \\mathrm{N}=1\\ \\mathrm{kg\\,m\\,s^{-2}}$</td></tr><tr><td>重量 weight</td><td>$W=mg$</td><td>N（重量是<strong>力</strong>，不是质量）</td></tr></tbody></table>"}, {"k": "note", "t": "标量、矢量与\"模型化\"", "h": "<h2>标量、矢量与\"模型化\"</h2><p>考纲 OT3 要求理解<strong>建模假设</strong>（modelling assumptions）。力学里最常见的几个词：</p>\n<ul><li><strong>质点</strong>（particle）：忽略大小与形状，质量集中于一点，因此不考虑转动与空气阻力形状效应。</li><li><strong>光滑</strong>（smooth）：无摩擦；<strong>粗糙</strong>（rough）：有摩擦。</li><li><strong>轻绳/轻杆</strong>（light string/rod）：质量可忽略，绳上张力处处相同。</li><li><strong>不可伸长</strong>（inextensible）：长度不变，因此绳两端的加速度大小相等。</li><li><strong>匀速/匀加速</strong>（uniform）：速度或加速度恒定。</li></ul>\n<p>$g$（重力加速度）取 $9.8\\ \\mathrm{m\\,s^{-2}}$，题目若指定 $9.8$ 或 $9.81$ 按题目要求用。</p>"}, {"k": "note", "t": "常见失分点", "h": "<h2>常见失分点</h2><ul><li>重量与质量混用（\"$W=5$ kg\"是错的，应为 $W=5g\\approx49$ N）。</li><li>单位未换算（速度给的是 km h$^{-1}$ 却直接代入 m s$^{-1}$ 的公式）。</li><li>答案不带单位或单位错误（N 写成 kg）。</li></ul>"}, {"k": "ex", "t": "例 1", "h": "<h2>例 1</h2><div class=\"stem\"><p>一辆车以 $72\\ \\mathrm{km\\,h^{-1}}$ 行驶，换算成 $\\mathrm{m\\,s^{-1}}$。</p></div>"}, {"k": "sol", "t": "例 1 解答", "h": "<h2 class=\"sol\">例 1 · 解答</h2><p>$$72\\ \\mathrm{km\\,h^{-1}}=\\frac{72\\times1000}{3600}\\ \\mathrm{m\\,s^{-1}}=20\\ \\mathrm{m\\,s^{-1}}$$</p>"}, {"k": "ex", "t": "例 2", "h": "<h2>例 2</h2><div class=\"stem\"><p>一个质量为 $3.5$ kg 的物体，求其重量（取 $g=9.8$）。</p></div>"}, {"k": "sol", "t": "例 2 解答", "h": "<h2 class=\"sol\">例 2 · 解答</h2><p>$$W=mg=3.5\\times9.8=34.3\\ \\mathrm{N}$$</p>"}, {"k": "ex", "t": "例 3", "h": "<h2>例 3</h2><div class=\"stem\"><p>力的单位为 $\\mathrm{kg\\,m\\,s^{-2}}$。据此说明 $F=ma$ 在单位上是否自洽。</p></div>"}, {"k": "sol", "t": "例 3 解答", "h": "<h2 class=\"sol\">例 3 · 解答</h2><p>右侧 $ma$ 的单位为 $\\mathrm{kg}\\times\\mathrm{m\\,s^{-2}}=\\mathrm{kg\\,m\\,s^{-2}}$，与力的单位一致，公式在量纲上自洽（这也正是牛顿的定义方式）。</p>"}, {"k": "q", "t": "练习 1", "h": "<h2>练习 1</h2><div class=\"stem\"><p>把 $54\\ \\mathrm{km\\,h^{-1}}$ 换算为 $\\mathrm{m\\,s^{-1}}$。</p></div>"}, {"k": "a", "t": "练习 1 答案", "h": "<h2 class=\"sol\">练习 1 · 答案</h2><div class=\"ans\"><p>$\\dfrac{54\\times1000}{3600}=15\\ \\mathrm{m\\,s^{-1}}$。</p></div>"}, {"k": "q", "t": "练习 2", "h": "<h2>练习 2</h2><div class=\"stem\"><p>写出速度、加速度、力的 S.I. 单位。</p></div>"}, {"k": "a", "t": "练习 2 答案", "h": "<h2 class=\"sol\">练习 2 · 答案</h2><div class=\"ans\"><p>速度 $\\mathrm{m\\,s^{-1}}$；加速度 $\\mathrm{m\\,s^{-2}}$；力 $\\mathrm{N}=\\mathrm{kg\\,m\\,s^{-2}}$。</p></div>"}, {"k": "q", "t": "练习 3", "h": "<h2>练习 3</h2><div class=\"stem\"><p>质量 $12$ kg 的物体重量是多少（$g=9.8$）？</p></div>"}, {"k": "a", "t": "练习 3 答案", "h": "<h2 class=\"sol\">练习 3 · 答案</h2><div class=\"ans\"><p>$W=12\\times9.8=117.6\\approx118$ N。</p></div>"}, {"k": "q", "t": "练习 4", "h": "<h2>练习 4</h2><div class=\"stem\"><p>解释\"轻绳\"与\"不可伸长\"两个建模假设的含义。</p></div>"}, {"k": "a", "t": "练习 4 答案", "h": "<h2 class=\"sol\">练习 4 · 答案</h2><div class=\"ans\"><p>轻绳：绳的质量忽略不计，因此绳上张力处处相同，且不需考虑绳自身的受力。不可伸长：绳长恒定，因此绳连接的两个物体沿绳方向的加速度大小相等、速度大小相等。</p></div>"}, {"k": "q", "t": "练习 5", "h": "<h2>练习 5</h2><div class=\"stem\"><p>一个力为 $50$ N，作用在 $2.5$ kg 的物体上，求加速度及单位。</p></div>"}, {"k": "a", "t": "练习 5 答案", "h": "<h2 class=\"sol\">练习 5 · 答案</h2><div class=\"ans\"><p>$a=\\dfrac{F}{m}=\\dfrac{50}{2.5}=20\\ \\mathrm{m\\,s^{-2}}$。</p></div>"}]}, {"key": "M7_运动学", "title": "M7 · 运动学 Kinematics", "short": "运动学 Kinematics", "group": "M", "slides": [{"k": "cover", "t": "M7 · 运动学 Kinematics", "h": "<div class=\"cover\"><h1>M7 · 运动学 Kinematics</h1><p class=\"sub\">考纲编号 Topic 7（Paper 2 力学）｜ 与纯数的微积分直接连通：位移—速度—加速度就是积分与求导。</p></div>"}, {"k": "spec", "t": "考纲要求", "h": "<h2>考纲要求</h2><ul class=\"big\"><li><p>7.1 理解并使用运动学的语言：<strong>位置、位移、路程、速度、速率、加速度</strong>。</p></li><li><p>7.2 理解、使用并解释直线运动的各种图像：<strong>位移—时间图</strong>（梯度即速度）与<strong>速度—时间图</strong>（梯度即加速度、面积即位移）。</p></li><li><p>7.3 理解、使用并<strong>推导</strong>直线运动的<strong>匀加速公式</strong>。</p></li><li><p>7.4 在直线运动中使用<strong>微积分</strong>：$v=\\dfrac{\\mathrm{d}r}{\\mathrm{d}t}$、$a=\\dfrac{\\mathrm{d}v}{\\mathrm{d}t}=\\dfrac{\\mathrm{d}^2r}{\\mathrm{d}t^2}$、$r=\\displaystyle\\int v\\,\\mathrm{d}t$、$v=\\displaystyle\\int a\\,\\mathrm{d}t$。</p></li></ul>"}, {"k": "note", "t": "7.1 六术语（必须区分清楚）", "h": "<h2>7.1 六术语（必须区分清楚）</h2><table><thead><tr><th>术语</th><th>含义</th><th>类型</th></tr></thead><tbody><tr><td>位置 position</td><td>相对原点的位置</td><td>矢量</td></tr><tr><td>位移 displacement $s$</td><td>位置的变化（含方向）</td><td>矢量</td></tr><tr><td>路程 distance travelled</td><td>路径总长（不含方向）</td><td>标量</td></tr><tr><td>速度 velocity $v$</td><td>位移的变化率</td><td>矢量</td></tr><tr><td>速率 speed</td><td>速度的大小</td><td>标量</td></tr><tr><td>加速度 acceleration $a$</td><td>速度的变化率</td><td>矢量</td></tr></tbody></table>\n<p>关键区别：物体往返一次回到起点，<strong>位移为 $0$ 而路程不为 $0$</strong>；平均速度为 $0$，平均速率不为 $0$。</p>"}, {"k": "note", "t": "7.2 两类图像", "h": "<h2>7.2 两类图像</h2><p><strong>位移—时间图</strong>（$s$–$t$）：梯度 $=$ 速度。水平段表示静止；斜率为负表示反向运动。</p>\n<p><strong>速度—时间图</strong>（$v$–$t$）：</p>\n<ul><li>梯度 $=$ 加速度；</li><li><strong>曲线下面积 $=$ 位移</strong>（$x$ 轴下方的面积取负）；</li><li>求<strong>路程</strong>时要把下方面积的绝对值加上去。</li></ul>\n<p>匀加速运动在 $v$–$t$ 图上是直线，梯形面积即位移，这也是推导匀加速公式的图形途径。</p>"}, {"k": "note", "t": "7.3 匀加速公式（公式册给出，但要求会推导）", "h": "<h2>7.3 匀加速公式（公式册给出，但要求会推导）</h2><p>设初速 $u$、末速 $v$、加速度 $a$、位移 $s$、时间 $t$：</p>\n<p>$$v=u+at$$</p>\n<p>$$s=ut+\\tfrac12 at^2$$</p>\n<p>$$s=vt-\\tfrac12 at^2$$</p>\n<p>$$v^2=u^2+2as$$</p>\n<p>$$s=\\tfrac12(u+v)t$$</p>"}, {"k": "note", "t": "7.3 匀加速公式（公式册给出，但要求会推导）", "h": "<h2 class=\"cont\">7.3 匀加速公式（公式册给出，但要求会推导）（续）</h2><p>推导（两式相消即可得全部）：</p>\n<p>由 $a=\\dfrac{v-u}{t}$ 得 $v=u+at$；平均速度 $\\dfrac{u+v}{2}$ 乘时间得 $s=\\dfrac12(u+v)t$；把 $v=u+at$ 代入得 $s=ut+\\dfrac12at^2$；由 $t=\\dfrac{v-u}{a}$ 代入 $s=\\dfrac12(u+v)t$ 得 $v^2=u^2+2as$。</p>"}, {"k": "note", "t": "7.4 用微积分处理变加速运动", "h": "<h2>7.4 用微积分处理变加速运动</h2><p>$$v=\\frac{\\mathrm{d}r}{\\mathrm{d}t},\\qquad a=\\frac{\\mathrm{d}v}{\\mathrm{d}t}=\\frac{\\mathrm{d}^2r}{\\mathrm{d}t^2}$$</p>\n<p>$$r=\\int v\\,\\mathrm{d}t,\\qquad v=\\int a\\,\\mathrm{d}t$$</p>\n<p>标准题型：给定位移函数 $r(t)$，两次求导得速度与加速度；或给定 $a(t)$，积分得 $v$（用初速定常数）、再积分得 $r$。</p>\n<p><strong>转向判定</strong>：速度为 $0$ 时物体可能改变方向；求\"最大位移\"就令 $v=0$。求\"总路程\"要先找转向时刻，分段计算位移后取绝对值相加。</p>\n<p>自由落体：$a=-g$（取向上为正），或直接取向下为正、$a=g$。竖直上抛最高点速度为 $0$。</p>"}, {"k": "note", "t": "常见失分点", "h": "<h2>常见失分点</h2><ul><li>位移与路程不分（$v$–$t$ 图面积直接当路程）。</li><li>忘记方向符号：取向上为正时 $a=-9.8$，正负写错结果全错。</li><li>变加速题仍套用匀加速公式。</li></ul>"}, {"k": "ex", "t": "例 1", "h": "<h2>例 1</h2><div class=\"stem\"><p>一辆车以 $4\\ \\mathrm{m\\,s^{-1}}$ 匀加速行驶，$a=2\\ \\mathrm{m\\,s^{-2}}$，求 $6$ s 后的速度与这 $6$ s 内的位移。</p></div>"}, {"k": "sol", "t": "例 1 解答", "h": "<h2 class=\"sol\">例 1 · 解答</h2><p>$$v=u+at=4+2(6)=16\\ \\mathrm{m\\,s^{-1}}$$</p>\n<p>$$s=ut+\\tfrac12at^2=4(6)+\\tfrac12(2)(36)=24+36=60\\ \\mathrm{m}$$</p>"}, {"k": "ex", "t": "例 2", "h": "<h2>例 2</h2><div class=\"stem\"><p>小球以 $15\\ \\mathrm{m\\,s^{-1}}$ 竖直上抛，取向上为正，$a=-9.8$。（a）最高高度；（b）回到出发点的时间。</p></div>"}, {"k": "sol", "t": "例 2 解答", "h": "<h2 class=\"sol\">例 2 · 解答</h2><p>（a）最高点 $v=0$：$v^2=u^2+2as\\ \\Rightarrow\\ 0=225-19.6s\\ \\Rightarrow\\ s=11.5\\ \\mathrm{m}$。</p>\n<p>（b）回到出发点 $s=0$：$0=15t-\\tfrac12(9.8)t^2=15t-4.9t^2$，$t=0$ 或 $t=\\dfrac{15}{4.9}=3.06\\ \\mathrm{s}$。</p>"}, {"k": "ex", "t": "例 3", "h": "<h2>例 3</h2><div class=\"stem\"><p>质点位移 $r=2t^3-9t^2+12t$（$t\\ge0$，单位 SI）。（a）求 $v$ 与 $a$ 的表达式；（b）求速度为 $0$ 的时刻；（c）求前 $3$ s 的路程。</p></div>"}, {"k": "sol", "t": "例 3 解答", "h": "<h2 class=\"sol\">例 3 · 解答</h2><p>（a）$v=\\dfrac{\\mathrm{d}r}{\\mathrm{d}t}=6t^2-18t+12$；$a=\\dfrac{\\mathrm{d}v}{\\mathrm{d}t}=12t-18$。</p>\n<p>（b）$6t^2-18t+12=0\\ \\Rightarrow\\ 6(t-1)(t-2)=0$，$t=1$ 与 $t=2$。</p>\n<p>（c）分段：$r(0)=0$；$r(1)=2-9+12=5$；$r(2)=16-36+24=4$；$r(3)=54-81+36=9$。</p>\n<p>路程 $=|5-0|+|4-5|+|9-4|=5+1+5=11\\ \\mathrm{m}$。（注意位移只有 $9$ m，路程是 $11$ m。）</p>"}, {"k": "ex", "t": "例 4", "h": "<h2>例 4</h2><div class=\"stem\"><p>一个质点的 $v$–$t$ 图：$0$–$4$ s 速度由 $0$ 线性增至 $8\\ \\mathrm{m\\,s^{-1}}$，$4$–$7$ s 保持 $8$，$7$–$10$ s 线性降至 $0$。求总位移与加速度各段的值。</p></div>"}, {"k": "sol", "t": "例 4 解答", "h": "<h2 class=\"sol\">例 4 · 解答</h2><p>位移即梯形面积：$0$–$4$ s 三角形 $\\dfrac12(4)(8)=16$；$4$–$7$ s 矩形 $3\\times8=24$；$7$–$10$ s 三角形 $\\dfrac12(3)(8)=12$。总位移 $=52\\ \\mathrm{m}$。</p>\n<p>加速度：$0$–$4$ s 为 $\\dfrac{8}{4}=2$；$4$–$7$ s 为 $0$；$7$–$10$ s 为 $\\dfrac{-8}{3}=-2.67$（单位 $\\mathrm{m\\,s^{-2}}$）。</p>"}, {"k": "q", "t": "练习 1", "h": "<h2>练习 1</h2><div class=\"stem\"><p>物体由静止匀加速，$a=3\\ \\mathrm{m\\,s^{-2}}$，求 $5$ s 内位移与末速。</p></div>"}, {"k": "a", "t": "练习 1 答案", "h": "<h2 class=\"sol\">练习 1 · 答案</h2><div class=\"ans\"><p>$s=\\dfrac12(3)(25)=37.5$ m；$v=3(5)=15\\ \\mathrm{m\\,s^{-1}}$。</p></div>"}, {"k": "q", "t": "练习 2", "h": "<h2>练习 2</h2><div class=\"stem\"><p>车以 $20\\ \\mathrm{m\\,s^{-1}}$ 匀减速至停止，加速度 $-4\\ \\mathrm{m\\,s^{-2}}$，求刹车距离。</p></div>"}, {"k": "a", "t": "练习 2 答案", "h": "<h2 class=\"sol\">练习 2 · 答案</h2><div class=\"ans\"><p>$v^2=u^2+2as\\Rightarrow 0=400-8s\\Rightarrow s=50$ m。</p></div>"}, {"k": "q", "t": "练习 3", "h": "<h2>练习 3</h2><div class=\"stem\"><p>质点 $r=t^3-6t^2+9t$，求速度为 $0$ 的时刻。</p></div>"}, {"k": "a", "t": "练习 3 答案", "h": "<h2 class=\"sol\">练习 3 · 答案</h2><div class=\"ans\"><p>$v=3t^2-12t+9=3(t-1)(t-3)=0$，$t=1$ 与 $t=3$。</p></div>"}, {"k": "q", "t": "练习 4", "h": "<h2>练习 4</h2><div class=\"stem\"><p>承上题，求 $0\\le t\\le4$ 内的总路程。</p></div>"}, {"k": "a", "t": "练习 4 答案", "h": "<h2 class=\"sol\">练习 4 · 答案</h2><div class=\"ans\"><p>$r(0)=0$，$r(1)=1-6+9=4$，$r(3)=27-54+27=0$，$r(4)=64-96+36=4$。路程 $=|4-0|+|0-4|+|4-0|=4+4+4=12$ m。</p></div>"}, {"k": "q", "t": "练习 5", "h": "<h2>练习 5</h2><div class=\"stem\"><p>已知 $a=6t-4$，且 $t=0$ 时 $v=2$、$r=0$，求 $v(t)$ 与 $r(t)$。</p></div>"}, {"k": "a", "t": "练习 5 答案", "h": "<h2 class=\"sol\">练习 5 · 答案</h2><div class=\"ans\"><p>$v=\\int(6t-4)\\mathrm{d}t=3t^2-4t+c$，$v(0)=2\\Rightarrow c=2$，故 $v=3t^2-4t+2$。$r=\\int v\\,\\mathrm{d}t=t^3-2t^2+2t+c'$，$r(0)=0\\Rightarrow c'=0$，故 $r=t^3-2t^2+2t$。</p></div>"}, {"k": "q", "t": "练习 6", "h": "<h2>练习 6</h2><div class=\"stem\"><p>说明位移—时间图的梯度与速度—时间图面积各代表什么。</p></div>"}, {"k": "a", "t": "练习 6 答案", "h": "<h2 class=\"sol\">练习 6 · 答案</h2><div class=\"ans\"><p>位移—时间图的梯度代表速度；速度—时间图曲线下的面积代表位移（$t$ 轴下方部分为负位移），其梯度代表加速度。</p></div>"}]}, {"key": "M8_力与牛顿定律", "title": "M8 · 力与牛顿定律 Forces and Newton's laws", "short": "力与牛顿定律 Forces and Newton's laws", "group": "M", "slides": [{"k": "cover", "t": "M8 · 力与牛顿定律 Forces and Newton's laws", "h": "<div class=\"cover\"><h1>M8 · 力与牛顿定律 Forces and Newton's laws</h1><p class=\"sub\">考纲编号 Topic 8（Paper 2 力学）｜ AS 力学的核心；连接体（滑轮）题是经典大题。</p></div>"}, {"k": "spec", "t": "考纲要求", "h": "<h2>考纲要求</h2><ul class=\"big\"><li><p>8.1 理解<strong>力</strong>的概念；理解并使用<strong>牛顿第一定律</strong>。</p></li><li><p>8.2 理解并使用<strong>牛顿第二定律</strong>，用于直线运动（限定于两个互相垂直方向上的力，以及以二维向量给出的力的简单情形）。</p></li><li><p>8.3 理解并使用<strong>重量</strong>与<strong>重力下的直线运动</strong>；重力加速度 $g$ 及其在 S.I. 单位下的取值精度。</p></li><li><p>8.4 理解并使用<strong>牛顿第三定律</strong>；质点上力的<strong>平衡</strong>与直线运动；涉及<strong>光滑滑轮与连接质点</strong>的应用问题。</p></li></ul>"}, {"k": "note", "t": "8.1 力与牛顿第一定律", "h": "<h2>8.1 力与牛顿第一定律</h2><p>力是矢量，单位是牛顿（N）。力可以改变物体的运动状态（产生加速度）或使物体形变。</p>\n<p><strong>牛顿第一定律</strong>：若合力为零，物体保持静止或匀速直线运动。</p>\n<p>推论：若物体静止或匀速直线运动，则<strong>合力为零</strong>（这是解题最常用的形式，即平衡条件）。</p>"}, {"k": "note", "t": "8.2 牛顿第二定律", "h": "<h2>8.2 牛顿第二定律</h2><p>$$\\mathbf{F}=m\\mathbf{a}\\qquad\\text{或}\\qquad F=ma$$</p>\n<p>要点：</p>\n<ul><li>$\\mathbf{F}$ 是<strong>合力</strong>（resultant force），不是某一个力；</li><li>方向与加速度方向一致；</li><li>单位是自洽的：$\\mathrm{N}=\\mathrm{kg\\,m\\,s^{-2}}$。</li></ul>\n<p>二维处理：把力分解到两个互相垂直的方向（通常是水平与竖直，或沿斜面与垂直斜面），<strong>每个方向独立列一个 $F=ma$</strong>。</p>\n<p>以向量形式给出力时：$\\mathbf{F}_{\\text{合}}=\\mathbf{F}_1+\\mathbf{F}_2$，再算 $\\mathbf{a}=\\dfrac{\\mathbf{F}_{\\text{合}}}{m}$。</p>"}, {"k": "note", "t": "8.3 重量", "h": "<h2>8.3 重量</h2><p>$$W=mg$$</p>\n<p>$g=9.8\\ \\mathrm{m\\,s^{-2}}$（题目会指定精度）。重量方向竖直向下。<strong>重量是力，单位是 N</strong>，别与质量（kg）混淆。</p>\n<p>自由落体（忽略空气阻力）：$a=g$，与质量无关。</p>"}, {"k": "note", "t": "8.4 牛顿第三定律与连接体", "h": "<h2>8.4 牛顿第三定律与连接体</h2><p><strong>牛顿第三定律</strong>：A 对 B 的力与 B 对 A 的力<strong>大小相等、方向相反</strong>，且作用在<strong>不同物体</strong>上。</p>\n<p>最容易犯的错误：把\"作用力与反作用力\"当成\"一对平衡力\"。区别在于——平衡力作用在<strong>同一个物体</strong>上，作用力与反作用力作用在<strong>两个不同物体</strong>上，不能相互抵消。</p>\n<p><strong>连接体（光滑滑轮）题的标准解法</strong>：</p>\n<ol><li>画出每个物体的<strong>受力图</strong>（隔离体图），标出重量、张力、法向支持力、阻力等；</li><li>对每个物体沿运动方向列 $F=ma$（轻绳不可伸长 ⇒ 两物体加速度大小相等）；</li><li>联立方程解出 $a$ 与张力 $T$。</li></ol>\n<p>典型情形（质量 $m_1$ 悬挂、$m_2$ 在光滑水平桌面上、轻绳跨过光滑滑轮）：</p>\n<p>对 $m_1$（向下为正）：$m_1g-T=m_1a$</p>"}, {"k": "note", "t": "8.4 牛顿第三定律与连接体", "h": "<h2 class=\"cont\">8.4 牛顿第三定律与连接体（续）</h2><p>对 $m_2$（向右为正）：$T=m_2a$</p>\n<p>联立：$a=\\dfrac{m_1g}{m_1+m_2}$，$T=\\dfrac{m_1m_2g}{m_1+m_2}$。</p>"}, {"k": "note", "t": "平衡", "h": "<h2>平衡</h2><p>质点平衡 ⇔ 合力为零。两个力平衡则等大反向共线；三个力平衡常用<strong>力的三角形</strong>（首尾相接闭合）或分解到两个方向列方程。</p>"}, {"k": "note", "t": "常见失分点", "h": "<h2>常见失分点</h2><ul><li>漏画某个力（尤其是法向支持力或绳的张力）。</li><li>把作用力—反作用力当成平衡力抵消。</li><li>连接体题中把两物体的加速度写成不同值。</li><li>忘记重量方向或把 $mg$ 写成质量。</li></ul>"}, {"k": "ex", "t": "例 1", "h": "<h2>例 1</h2><div class=\"stem\"><p>质量 $5$ kg 的箱子在水平方向受 $30$ N 推力，同时受 $10$ N 摩擦阻力。求加速度。</p></div>"}, {"k": "sol", "t": "例 1 解答", "h": "<h2 class=\"sol\">例 1 · 解答</h2><p>水平方向合力 $=30-10=20$ N。</p>\n<p>$$a=\\frac{20}{5}=4\\ \\mathrm{m\\,s^{-2}}$$</p>"}, {"k": "ex", "t": "例 2", "h": "<h2>例 2</h2><div class=\"stem\"><p>质量 $2$ kg 的质点受力 $\\mathbf{F}_1=\\begin{pmatrix}6\\\\4\\end{pmatrix}$ N 与 $\\mathbf{F}_2=\\begin{pmatrix}-2\\\\-8\\end{pmatrix}$ N。求加速度向量及其大小。</p></div>"}, {"k": "sol", "t": "例 2 解答", "h": "<h2 class=\"sol\">例 2 · 解答</h2><p>$$\\mathbf{F}_{\\text{合}}=\\begin{pmatrix}4\\\\-4\\end{pmatrix}\\ \\mathrm{N},\\qquad \\mathbf{a}=\\frac{1}{2}\\begin{pmatrix}4\\\\-4\\end{pmatrix}=\\begin{pmatrix}2\\\\-2\\end{pmatrix}\\ \\mathrm{m\\,s^{-2}}$$</p>\n<p>$$|\\mathbf{a}|=\\sqrt{4+4}=2\\sqrt2\\approx2.83\\ \\mathrm{m\\,s^{-2}}$$</p>"}, {"k": "ex", "t": "例 3", "h": "<h2>例 3</h2><div class=\"stem\"><p>质量 $3$ kg 的物块悬挂在桌边，通过轻绳跨过光滑滑轮与桌面上 $2$ kg 的物块相连，桌面光滑。$g=9.8$。求加速度与绳的张力。</p></div>"}, {"k": "sol", "t": "例 3 解答", "h": "<h2 class=\"sol\">例 3 · 解答</h2><p>设加速度大小为 $a$，张力为 $T$。</p>\n<p>对悬挂物（向下为正）：$3g-T=3a$</p>\n<p>对桌面物（向右为正）：$T=2a$</p>\n<p>代入：$3(9.8)-2a=3a\\ \\Rightarrow\\ 29.4=5a\\ \\Rightarrow\\ a=5.88\\ \\mathrm{m\\,s^{-2}}$</p>\n<p>$T=2a=11.76\\approx11.8$ N。</p>"}, {"k": "q", "t": "练习 1", "h": "<h2>练习 1</h2><div class=\"stem\"><p>质量 $8$ kg 的物体受合力 $24$ N，求加速度。</p></div>"}, {"k": "a", "t": "练习 1 答案", "h": "<h2 class=\"sol\">练习 1 · 答案</h2><div class=\"ans\"><p>$a=\\dfrac{24}{8}=3\\ \\mathrm{m\\,s^{-2}}$。</p></div>"}, {"k": "q", "t": "练习 2", "h": "<h2>练习 2</h2><div class=\"stem\"><p>质量 $60$ kg 的人站在电梯中，电梯以 $1.5\\ \\mathrm{m\\,s^{-2}}$ 向上加速，$g=9.8$。求地板对人的支持力。</p></div>"}, {"k": "a", "t": "练习 2 答案", "h": "<h2 class=\"sol\">练习 2 · 答案</h2><div class=\"ans\"><p>对人受力：支持力 $R$ 向上，重量 $mg$ 向下。取向上为正：$R-mg=ma$，$R=60(9.8+1.5)=60(11.3)=678$ N。</p></div>"}, {"k": "q", "t": "练习 3", "h": "<h2>练习 3</h2><div class=\"stem\"><p>说明牛顿第三定律，并指出它与一对平衡力的区别。</p></div>"}, {"k": "a", "t": "练习 3 答案", "h": "<h2 class=\"sol\">练习 3 · 答案</h2><div class=\"ans\"><p>牛顿第三定律：若 A 对 B 施加大小为 $F$ 的力，则 B 对 A 施加大小相等、方向相反的力，二者作用在不同物体上、性质相同。平衡力则作用在同一个物体上，合力为零。作用力与反作用力不能相互抵消，因为它们不作用于同一物体。</p></div>"}, {"k": "q", "t": "练习 4", "h": "<h2>练习 4</h2><div class=\"stem\"><p>质量 $4$ kg 的物体在光滑水平面上，受力 $\\begin{pmatrix}12\\\\0\\end{pmatrix}$ N，求 $3$ s 后的速度（初速为零）。</p></div>"}, {"k": "a", "t": "练习 4 答案", "h": "<h2 class=\"sol\">练习 4 · 答案</h2><div class=\"ans\"><p>$a=\\dfrac{12}{4}=3\\ \\mathrm{m\\,s^{-2}}$，$v=at=9\\ \\mathrm{m\\,s^{-1}}$，方向沿力的方向。</p></div>"}, {"k": "q", "t": "练习 5", "h": "<h2>练习 5</h2><div class=\"stem\"><p>悬挂物质量 $5$ kg，桌面物质量 $3$ kg，桌面光滑，$g=9.8$。求加速度与张力。</p></div>"}, {"k": "a", "t": "练习 5 答案", "h": "<h2 class=\"sol\">练习 5 · 答案</h2><div class=\"ans\"><p>$5g-T=5a$；$T=3a$。$49=8a\\Rightarrow a=6.125\\ \\mathrm{m\\,s^{-2}}$；$T=3(6.125)=18.4$ N。</p></div>"}, {"k": "q", "t": "练习 6", "h": "<h2>练习 6</h2><div class=\"stem\"><p>一个 $10$ kg 的物体以 $2\\ \\mathrm{m\\,s^{-2}}$ 向上加速运动，求使其运动的向上的拉力（$g=9.8$）。</p></div>"}, {"k": "a", "t": "练习 6 答案", "h": "<h2 class=\"sol\">练习 6 · 答案</h2><div class=\"ans\"><p>取向上为正：$P-mg=ma$，$P=10(9.8+2)=118$ N。</p></div>"}]}], "gmeta": {"P": {"title": "Paper 1 · 纯数 Pure Mathematics（9 个专题）", "label": "Pure · 纯数"}, "S": {"title": "Paper 2 Section A · 统计 Statistics（5 个专题）", "label": "Statistics · 统计"}, "M": {"title": "Paper 2 Section B · 力学 Mechanics（3 个专题）", "label": "Mechanics · 力学"}}, "grank": ["P", "S", "M"]};
let cur = null, idx = 0;

function renderMenu(){
  let h = '';
  DATA.grank.forEach(function(g){
    h += '<h3>' + DATA.gmeta[g].title + '</h3><div class="grid">';
    DATA.decks.filter(function(d){return d.group===g;}).forEach(function(d){
      h += '<div class="card" onclick="openDeck(\'' + d.key + '\')"><div class="t">' +
           d.title + '</div><div class="c">' + d.slides.length + ' 张</div></div>';
    });
    h += '</div>';
  });
  document.getElementById('groups').innerHTML = h;
  typeset('groups');
}
/* MathJax 是异步加载的：动态插入内容后必须重新排版。
   用单一 Promise 链串行化所有 typeset 调用，避免快速翻页时 MathJax 报
   "Typeset already in progress"；加载未完成则轮询重试。 */
let _tp = Promise.resolve();
function typeset(id){
  const run = function() {
    const el = id ? [document.getElementById(id)] : undefined;
    return window.MathJax.typesetPromise(el);
  };
  if (window.MathJax && window.MathJax.typesetPromise) {
    _tp = _tp.then(run).catch(function(e){ /* 忽略局部排版异常，继续后续 */ });
  } else {
    setTimeout(function(){ typeset(id); }, 120);
  }
}
function renderIdx(){
  if(!cur) return;
  let h = '';
  cur.slides.forEach(function(s,i){
    h += '<a href="#" class="' + (i===idx?'on':'') + '" onclick="go(' + i + ');return false;">' +
         (i+1) + '. ' + s.t + '</a>';
  });
  document.getElementById('idx').innerHTML = h;
  typeset('idx');
}
function toggleIdx(){
  const el = document.getElementById('idx');
  el.classList.toggle('on');
  if(el.classList.contains('on')) renderIdx();
}
function openDeck(key){
  cur = DATA.decks.find(function(d){return d.key===key;});
  idx = 0;
  document.getElementById('menu').classList.remove('on');
  document.getElementById('stage').classList.add('on');
  render();
}
function backMenu(){
  document.getElementById('stage').classList.remove('on');
  document.getElementById('menu').classList.add('on');
}
function go(i){ idx = i; render(); if(document.getElementById('idx').classList.contains('on')) renderIdx(); }
function render(){
  const s = cur.slides[idx];
  const kind = {cover:'封面',spec:'考纲要求',note:'知识点',ex:'例题',sol:'例题解答',q:'练习',a:'练习答案'}[s.k] || '';
  document.getElementById('slide').innerHTML =
    '<div class="kind">' + kind + '　|　' + cur.title + '</div>' + s.h;
  document.getElementById('pos').textContent = (idx+1) + ' / ' + cur.slides.length;
  document.getElementById('topic').textContent = cur.title;
  document.getElementById('prog').style.width = ((idx+1)/cur.slides.length*100) + '%';
  typeset('slide');
}
function prev(){ if(!cur) return; idx = Math.max(0, idx-1); render();
  if(document.getElementById('idx').classList.contains('on')) renderIdx(); }
function next_(){ if(!cur) return; idx = Math.min(cur.slides.length-1, idx+1); render();
  if(document.getElementById('idx').classList.contains('on')) renderIdx(); }
function full(){
  const el = document.documentElement;
  if(!document.fullscreenElement){ el.requestFullscreen && el.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
document.addEventListener('keydown', function(e){
  if(!cur) return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next_(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ go(0); }
  else if(e.key === 'End'){ go(cur.slides.length-1); }
  else if(e.key === 'f' || e.key === 'F'){ full(); }
  else if(e.key === 'Escape'){ backMenu(); }
});
renderMenu();
// 支持从总目录/其他页带参数直接进入某个专题
(function(){
  const want = sessionStorage.getItem('deck');
  const hash = decodeURIComponent((location.hash || '').replace('#',''));
  const key = want || hash;
  if (key && DATA.decks.some(function(d){return d.key === key;})) {
    sessionStorage.removeItem('deck');
    openDeck(key);
  }
})();
</script>
